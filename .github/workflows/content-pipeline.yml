name: OmniLede content pipeline

on:
  schedule:
    - cron: "15 7 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: omnilede-content-pipeline
  cancel-in-progress: false

jobs:
  fetch-and-draft:
    runs-on: ubuntu-latest
    env:
      DRAFT_GENERATION_ENABLED: ${{ secrets.DRAFT_GENERATION_ENABLED }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ANTHROPIC_MODEL: ${{ secrets.ANTHROPIC_MODEL }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fetch trending stories
        run: npm run content:fetch

      - name: Generate optional editorial drafts
        if: ${{ env.DRAFT_GENERATION_ENABLED == 'true' && env.ANTHROPIC_API_KEY != '' && env.ANTHROPIC_MODEL != '' }}
        run: npm run content:generate

      - name: Validate content
        run: npm run validate:content

      - name: Commit queue and drafts
        run: |
          if git diff --quiet -- content/queue content/drafts; then
            echo "No queue or draft changes to commit."
            exit 0
          fi
          git config user.name "omnilede-bot"
          git config user.email "actions@users.noreply.github.com"
          git add content/queue content/drafts
          git commit -m "chore: refresh content queue"
          git push
