<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Abstract global economic forecast</title>
  <desc id="desc">Amber forecast bands cross a grid of uncertain economic scenarios.</desc>
