<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Abstract stock index rebalance</title>
  <desc id="desc">Cyan weighted blocks rebalance around a market index line.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#08232a"/><stop offset="1" stop-color="#075b68"/></linearGradient><linearGradient id="bar" x1="0" y1="1" x2="0" y2="0"><stop stop-color="#0891b2"/><stop offset="1" stop-color="#a5f3fc"/></linearGradient></defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <g fill="url(#bar)"><rect x="180" y="520" width="150" height="210" rx="16"/><rect x="390" y="370" width="150" height="360" rx="16"/><rect x="600" y="450" width="150" height="280" rx="16"/><rect x="810" y="250" width="150" height="480" rx="16"/><rect x="1020" y="330" width="150" height="400" rx="16"/><rect x="1230" y="180" width="150" height="550" rx="16"/></g>
  <path d="m160 470 260-170 250 70 215-190 235 80 300-150" fill="none" stroke="#f8f3e8" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="#f8f3e8"><circle cx="420" cy="300" r="24"/><circle cx="670" cy="370" r="24"/><circle cx="885" cy="180" r="24"/><circle cx="1120" cy="260" r="24"/></g>
</svg>
